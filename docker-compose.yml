# Entorno local de CENTYNELLA-CORE: API (contra MongoDB Atlas) + Mongo local opcional.
#
#   docker compose up -d --build                  # solo la API (usa Atlas)
#   docker compose --profile local up -d mongo    # además, Mongo local (opcional)
#   docker compose down                           # detiene (los datos locales persisten en el volumen)
#   docker compose --profile local down -v        # detiene y BORRA los datos locales

services:
  # MongoDB local OPCIONAL (perfil "local"): no arranca con un `up` normal.
  mongo:
    profiles: ['local']
    image: mongo:7
    container_name: centynella-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: centynella-core
    restart: unless-stopped
    # Usa la MongoDB Atlas de private/.env.sandbox (base centynella_sandbox).
    # Para usar el Mongo local: `--profile local` y define MONGODB_URI=mongodb://mongo:27017.
    env_file: private/.env.sandbox
    ports:
      - '8000:8000'

volumes:
  mongo-data:
